<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f1ec;--panel:#f9f8f5;--card:#fff;--line:#e4e0d7;--line2:#eeebe5;--hover:#f1eee8;
  --ink:#1e2330;--ink2:#575e6e;--ink3:#8b909d;
  --accent:#2a4b8d;--accent-ink:#fff;--accent-soft:#e6ebf6;
  --task:#3c8a62;--meeting:#2e69d3;--reminder:#c3831a;--deadline:#cc4234;
  --task-s:#e5f2eb;--meeting-s:#e6eefc;--reminder-s:#fbf1df;--deadline-s:#fbe7e4;
  --danger:#cc4234;--ok:#3c8a62;--shadow:0 1px 2px rgba(20,24,34,.05),0 6px 20px rgba(20,24,34,.06);
  --shadow-lg:0 -8px 40px rgba(20,24,34,.18);
  --r:14px;color-scheme:light;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317;--panel:#16191e;--card:#1c2027;--line:#2a2f38;--line2:#222730;--hover:#222731;
  --ink:#e8eaef;--ink2:#a7adb9;--ink3:#737a88;
  --accent:#7ea4ff;--accent-ink:#0d1424;--accent-soft:#1e2944;
  --task:#5fbb8b;--meeting:#6d9eff;--reminder:#e3a541;--deadline:#f06c5e;
  --task-s:#1b2b23;--meeting-s:#1b2539;--reminder-s:#2e2617;--deadline-s:#33201e;
  --danger:#f06c5e;--ok:#5fbb8b;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111317;--panel:#16191e;--card:#1c2027;--line:#2a2f38;--line2:#222730;--hover:#222731;
  --ink:#e8eaef;--ink2:#a7adb9;--ink3:#737a88;
  --accent:#7ea4ff;--accent-ink:#0d1424;--accent-soft:#1e2944;
  --task:#5fbb8b;--meeting:#6d9eff;--reminder:#e3a541;--deadline:#f06c5e;
  --task-s:#1b2b23;--meeting-s:#1b2539;--reminder-s:#2e2617;--deadline-s:#33201e;
  --danger:#f06c5e;--ok:#5fbb8b;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 -8px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{font-size:16px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* --- шапка и строка ввода --- */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--st) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hrow h1{margin:0;font:700 26px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow small{display:block;font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-top:2px}
.syncb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--reminder)}.dot.err{background:var(--danger)}
.dot.busy{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.qa{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;box-shadow:var(--shadow)}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qa input{flex:1;border:0;outline:0;background:transparent;padding:9px 2px;min-width:0}
.qa input::placeholder{color:var(--ink3)}
.ib{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:active{background:var(--hover)}
.ib.primary{background:var(--accent);color:var(--accent-ink)}
.ib.rec{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(204,66,52,.5)}70%{box-shadow:0 0 0 10px rgba(204,66,52,0)}100%{box-shadow:0 0 0 0 rgba(204,66,52,0)}}
.preview{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 0;font-size:13px}
.preview:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip svg.i{width:14px;height:14px}
.chip.t-task{background:var(--task-s);color:var(--task);border-color:transparent}
.chip.t-meeting{background:var(--meeting-s);color:var(--meeting);border-color:transparent}
.chip.t-reminder{background:var(--reminder-s);color:var(--reminder);border-color:transparent}
.chip.t-deadline{background:var(--deadline-s);color:var(--deadline);border-color:transparent}

main{padding:4px 16px calc(var(--sb) + 96px)}
header.top>*,main{max-width:640px;margin-left:auto;margin-right:auto}
.sheet{max-width:640px;margin:0 auto}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{margin:0 0 20px}
.sec>h3{display:flex;align-items:center;gap:8px;margin:0 0 8px 4px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sec>h3 .act{margin-left:auto;text-transform:none;letter-spacing:0;font-size:14px;color:var(--accent);font-weight:600;padding:2px 4px}
.sec.red>h3{color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;overflow:hidden}
.empty{padding:28px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-weight:600;margin-bottom:4px;font-size:17px}

/* --- запись --- */
.sw{position:relative;border-top:1px solid var(--line2);overflow:hidden}
.list>.sw:first-child{border-top:0}
.sw .bgl,.sw .bgr{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:600;font-size:14px;gap:8px;opacity:0}
.sw .bgl{background:var(--ok)}
.sw .bgr{background:var(--danger);justify-content:flex-end}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px 12px 14px;position:relative;background:var(--card);touch-action:pan-y;will-change:transform}
.item::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.item.t-task{--c:var(--task);--cs:var(--task-s)}.item.t-meeting{--c:var(--meeting);--cs:var(--meeting-s)}
.item.t-reminder{--c:var(--reminder);--cs:var(--reminder-s)}.item.t-deadline{--c:var(--deadline);--cs:var(--deadline-s)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;flex:none;transition:background .15s,transform .15s;margin:-1px 0}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;opacity:0;fill:none;stroke-linecap:round;stroke-linejoin:round}
.item.done .check{background:var(--c)}
.item.done .check svg{opacity:1}
.item.done .ttl{color:var(--ink3);text-decoration:line-through}
.item.pop .check{transform:scale(1.25)}
.item.past{opacity:.55}
.body{flex:1;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:3px;font-size:13px;color:var(--ink3)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg.i{width:14px;height:14px}
.meta .late{color:var(--danger);font-weight:600}
.meta .soon{color:var(--reminder);font-weight:600}
.tm{flex:none;width:46px;text-align:right;font-size:14px;font-weight:600;color:var(--ink2);padding-top:1px}
.tm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.star{color:var(--reminder)}

/* --- сегодня --- */
.hero{display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:20px}
.hero h2{margin:0;font-size:18px;font-weight:600}
.hero p{margin:3px 0 0;color:var(--ink2);font-size:14px}
.ring{margin-left:auto;position:relative;width:56px;height:56px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
.nowline{display:flex;align-items:center;gap:8px;color:var(--danger);font-size:12px;font-weight:700;padding:2px 14px}
.nowline div{flex:1;height:2px;background:var(--danger);border-radius:2px}

/* --- календарь --- */
.calh{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.calh b{flex:1;font-size:18px;font-weight:600;padding-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);padding:6px;gap:2px;margin-bottom:18px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;padding:4px 0 6px}
.cal button{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.cal button.out{color:var(--ink3);opacity:.5}
.cal button.wk{color:var(--danger)}
.cal button.today span{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:600}
.cal button.sel{background:var(--accent-soft)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}

/* --- сроки --- */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlc{padding:14px;position:relative;overflow:hidden;text-align:left}
.dlc .big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.dlc .big small{font-size:13px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:3px}
.dlc .t{margin-top:8px;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.dlc .d{color:var(--ink3);font-size:12.5px;margin-top:2px}
.dlc .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line2)}
.dlc .bar i{display:block;height:100%}

/* --- нижнее меню --- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--panel) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(var(--sb) + 6px)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3);padding:4px 0;position:relative;font-weight:500}
nav.tabs button svg.i{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
nav.tabs .badge.n{background:var(--ink3)}

/* --- лист редактирования --- */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:4px 10px 8px 16px;flex:none}
.sheet .sh b{flex:1;font-size:17px}
.sheet .sbody{overflow-y:auto;padding:4px 16px calc(var(--sb) + 18px);-webkit-overflow-scrolling:touch}
.f{margin-bottom:14px}
.f>label{display:block;font-size:12.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px 2px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:0}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:84px;resize:vertical}
.ttlin{font-size:18px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;color:var(--ink2);font-weight:500;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink2)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.tog:last-child{border-bottom:0}
.tog span{flex:1}
.sw2{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.on>.sw2{background:var(--accent)}
.on>.sw2::after{transform:translateX(18px)}
.sub{display:flex;align-items:center;gap:10px;padding:8px 2px}
.sub input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.sub input[type=text]{flex:1;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:6px 0;outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn svg.i{width:18px;height:18px}
.btns{display:flex;gap:10px;margin-top:6px}
.btns .btn{flex:1}
.more .tog svg.i{color:var(--ink2)}
.more .cnt{color:var(--ink3);font-size:14px}
.note{color:var(--ink2);font-size:14px;line-height:1.5;padding:12px 14px}
.note ol{margin:6px 0 0;padding-left:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:last-child{color:var(--ink2);text-align:right}

/* --- снек --- */
.snack{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 76px);z-index:60;background:#1e2330;color:#fff;border-radius:14px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .2s}
.snack.on{transform:none;opacity:1;pointer-events:auto}
.snack span{flex:1;font-size:15px}
.snack button{color:#9db8ff;font-weight:700;padding:6px 10px}

/* --- первый запуск --- */
.setup{padding:calc(var(--st) + 40px) 24px 40px;max-width:480px;margin:0 auto}
.setup img{width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow)}
.setup h1{font-size:28px;margin:18px 0 8px;letter-spacing:-.02em}
.setup p{color:var(--ink2);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script src="parse_ru.js"></script>
<script>
'use strict';
const P = window.ParseRu;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const pad = n => String(n).padStart(2, '0');
const WD = ['пн','вт','ср','чт','пт','сб','вс'];
const WDF = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const TYPES = {task:['Дело','list'], meeting:['Встреча','users'], reminder:['Напоминание','bell'], deadline:['Срок','hour']};
const REPEAT = {none:'Не повторять', daily:'Каждый день', weekdays:'По будням', weekly:'Каждую неделю', monthly:'Каждый месяц', yearly:'Каждый год'};
const REMINDS = [[0,'В момент'],[5,'5 мин'],[15,'15 мин'],[30,'30 мин'],[60,'1 час'],[120,'2 часа'],[1440,'1 день'],[4320,'3 дня'],[10080,'Неделя']];
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; };

// ---------- хранение на телефоне ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem('planer.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('planer.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('planer.' + k); } catch {} },
};
let CFG = LS.get('cfg', null);           // {token, repo}
let D = LS.get('doc', {items: [], purged: {}});   // рабочая копия
let REM = LS.get('remote', null);        // последняя увиденная облачная копия
let SHA = LS.get('sha', null);
let TZ = (REM && REM.tz != null) ? +REM.tz : 3;
const saveLocal = () => { LS.set('doc', D); LS.set('remote', REM); LS.set('sha', SHA); };

// ---------- время планера (по умолчанию Москва) ----------
const tzNow = () => P.nowTz(TZ);
const today = () => P.iso(tzNow());
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return P.mk(y, m, d); };
const dayDiff = s => Math.round((fromIso(s) - fromIso(today())) / 864e5);
const nowMin = () => tzNow().toISOString().slice(0, 16);
function dayLabel(s, wd = true) {
  if (!s) return 'Без даты';
  const d = fromIso(s), t = fromIso(today()), diff = dayDiff(s);
  const base = `${d.getUTCDate()} ${MG[d.getUTCMonth()]}` + (d.getUTCFullYear() !== t.getUTCFullYear() ? ` ${d.getUTCFullYear()}` : '');
  const rel = {0:'Сегодня', 1:'Завтра', 2:'Послезавтра', '-1':'Вчера'}[diff];
  if (rel) return rel + (wd ? `, ${WD[P.wday(d)]}` : '');
  return (wd ? `${WD[P.wday(d)]}, ` : '') + base;
}
function remindLabel(m) {
  if (m === 0) return 'в момент';
  if (m % 1440 === 0) return m === 1440 ? 'за день' : `за ${m / 1440} дн.`;
  if (m % 60 === 0) return m === 60 ? 'за час' : `за ${m / 60} ч`;
  return `за ${m} мин`;
}
function itemDT(it) {
  if (!it.date) return null;
  const d = fromIso(it.date);
  const [h, m] = (it.time || '23:59').split(':').map(Number);
  return new Date(d.getTime() + (h * 60 + m) * 6e4);
}
function until(it) {
  const d = itemDT(it); if (!d || !it.time) return '';
  const min = Math.round((d - tzNow()) / 6e4), dur = it.duration || 0;
  if (min < 0 && it.type === 'meeting' && -min < dur) return 'идет сейчас';
  if (min < 0) return '';
  if (min < 1) return 'сейчас';
  if (min < 60) return `через ${min} мин`;
  if (min < 600) { const h = Math.floor(min / 60), m = min % 60; return `через ${h} ч` + (m ? ` ${m} мин` : ''); }
  if (min < 2880) return `через ${Math.round(min / 60)} ч`;
  const dd = Math.round(min / 1440); return `через ${dd} ${plural(dd, 'день', 'дня', 'дней')}`;
}
const isOverdue = it => !it.done && it.date && it.date < today() && it.type !== 'meeting';
const byTime = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99') || (b.important - a.important) || (a.created || '').localeCompare(b.created || '');

// ---------- записи (та же логика, что на компьютере) ----------
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(5)), b => b.toString(16).padStart(2, '0')).join('');
const stamp = () => Date.now();
function norm(it) {
  const b = {id: uid(), type: 'task', title: '', notes: '', place: '', date: null, time: null, duration: null, remind: [], repeat: 'none',
    tags: [], important: false, urgent: false, top: false, subtasks: [], done: false, done_at: null, deleted: false, deleted_at: null,
    created: nowMin(), source: 'phone', fired: [], snooze: null, spawned: null, upd: 0};
  for (const k of Object.keys(b)) if (it[k] !== undefined) b[k] = it[k];
  if (!TYPES[b.type]) b.type = 'task';
  if (!REPEAT[b.repeat]) b.repeat = 'none';
  b.remind = [...new Set((b.remind || []).map(Number).filter(n => Number.isFinite(n)))].sort((x, y) => y - x);
  b.tags = (b.tags || []).map(t => String(t).replace(/^#/, '').trim()).filter(Boolean);
  b.date = b.date || null; b.time = b.time || null;
  return b;
}
const fireKey = (it, off) => `${it.date} ${it.time || ''}|${off}`;
function baseDT(it) {
  if (!it.date) return null;
  const [h, m] = (it.time || '09:00').split(':').map(Number);
  return new Date(fromIso(it.date).getTime() + (h * 60 + m) * 6e4);
}
function prime(it) {
  it.fired = [];
  const b = baseDT(it); if (!b) return;
  const n = tzNow().getTime() - 6e4;
  for (const off of it.remind) if (b.getTime() - off * 6e4 < n) it.fired.push(fireKey(it, off));
}
function nextDate(d, rep) {
  if (rep === 'daily') return P.addDays(d, 1);
  if (rep === 'weekdays') { d = P.addDays(d, 1); while (P.wday(d) >= 5) d = P.addDays(d, 1); return d; }
  if (rep === 'weekly') return P.addDays(d, 7);
  if (rep === 'monthly') return P.addMonths(d, 1);
  if (rep === 'yearly') return P.addMonths(d, 12);
  return null;
}
const find = id => D.items.find(i => i.id === id);
const live = () => D.items.filter(i => !i.deleted);

function addItem(fields) {
  const it = norm(Object.assign({}, fields, {source: 'phone'}));
  it.id = uid(); it.upd = stamp(); it.created = nowMin();
  prime(it);
  D.items.push(it);
  changed();
  return it;
}
function updateItem(id, f) {
  const it = find(id); if (!it) return;
  if ('done' in f && f.done !== it.done) complete(id, f.done, false);
  const g = Object.assign({}, f); ['id', 'done', 'done_at', 'fired', 'created', 'spawned', 'upd'].forEach(k => delete g[k]);
  const timing = ['date', 'time', 'remind'].some(k => k in g && JSON.stringify(g[k]) !== JSON.stringify(it[k]));
  Object.assign(it, norm(Object.assign({}, it, g)));
  it.upd = stamp();
  if (timing) { prime(it); it.snooze = null; }
  changed();
  return it;
}
function complete(id, done = true, save = true) {
  const it = find(id); if (!it) return null;
  let spawned = null;
  if (done && !it.done) {
    it.done = true; it.done_at = nowMin(); it.snooze = null; it.upd = stamp();
    if (it.repeat !== 'none' && it.date) {
      let d = nextDate(fromIso(it.date), it.repeat);
      const t = fromIso(today());
      while (d < t) d = nextDate(d, it.repeat);
      const nx = Object.assign({}, it);
      ['id', 'done', 'done_at', 'fired', 'spawned', 'snooze', 'created'].forEach(k => delete nx[k]);
      nx.date = P.iso(d);
      nx.subtasks = it.subtasks.map(s => Object.assign({}, s, {done: false}));
      spawned = norm(nx); spawned.source = it.source; spawned.upd = stamp();
      prime(spawned);
      D.items.push(spawned);
      it.spawned = spawned.id;
    }
  } else if (!done && it.done) {
    it.done = false; it.done_at = null; it.upd = stamp();
    const sp = find(it.spawned || '');
    if (sp && !sp.done) { D.items = D.items.filter(x => x !== sp); D.purged[sp.id] = stamp(); }
    it.spawned = null;
  }
  if (save) changed();
  return spawned;
}
function setDeleted(id, del) {
  const it = find(id); if (!it) return;
  it.deleted = del; it.deleted_at = del ? nowMin() : null; it.upd = stamp();
  changed();
}
function purge(id) {
  const gone = D.items.filter(i => i.deleted && (id == null || i.id === id));
  gone.forEach(i => D.purged[i.id] = stamp());
  D.items = D.items.filter(i => !gone.includes(i));
  changed();
}
function changed() { saveLocal(); render(); queueSync(800); }

// ---------- синхронизация через GitHub ----------
const SY = {state: 'idle', err: '', last: LS.get('last', ''), busy: false, again: false, timer: null};
function b64dec(s) { const bin = atob(s.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function b64enc(str) { const by = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); }
async function gh(method, body) {
  const r = await fetch(`https://api.github.com/repos/${CFG.repo}/contents/sync.json` + (method === 'GET' ? `?t=${Date.now()}` : ''), {
    method, cache: 'no-store',
    headers: Object.assign({'Authorization': `Bearer ${CFG.token}`, 'Accept': 'application/vnd.github+json'}, body ? {'Content-Type': 'application/json'} : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {}; try { j = await r.json(); } catch {}
  return {code: r.status, j};
}
function canon(doc) {
  if (!doc) return '';
  const items = [...(doc.items || [])].sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0).map(i => { const c = Object.assign({}, i); delete c.fired; return c; });
  const ks = o => JSON.stringify(o, Object.keys(o).sort());
  return JSON.stringify([items.map(i => JSON.stringify(i, Object.keys(i).sort())), ks(doc.purged || {}), (doc.subs || []).map(s => s.endpoint).sort()]);
}
function mergeInto(remote) {
  const purged = Object.assign({}, D.purged);
  for (const [k, v] of Object.entries(remote.purged || {})) purged[k] = Math.max(+v, +(purged[k] || 0));
  const mine = new Map(D.items.map(i => [i.id, i]));
  const rem = new Map((remote.items || []).filter(i => i.id).map(i => [i.id, i]));
  const ids = [...D.items.map(i => i.id), ...[...rem.keys()].filter(k => !mine.has(k))];
  const out = [];
  for (const id of ids) {
    if (purged[id]) continue;
    const l = mine.get(id), r = rem.get(id);
    if (r && (!l || +(r.upd || 0) >= +(l.upd || 0))) { const n = norm(r); n.id = id; out.push(n); }
    else out.push(l);
  }
  D.items = out; D.purged = purged;
}
function queueSync(ms = 0) { clearTimeout(SY.timer); SY.timer = setTimeout(sync, ms); }
async function sync() {
  if (!CFG) return;
  if (SY.busy) { SY.again = true; return; }
  SY.busy = true; SY.state = 'busy'; renderSync();
  try {
    for (let attempt = 0; ; attempt++) {
      if (attempt > 5) throw new Error('облачная копия все время меняется');
      const g = await gh('GET');
      let remote = null;
      if (g.code === 200) { remote = JSON.parse(b64dec(g.j.content || '') || 'null'); SHA = g.j.sha; }
      else if (g.code === 404) { remote = null; SHA = null; }
      else if (g.code === 401 || g.code === 403) throw new Error('нет доступа (ключ отозван или истек)');
      else throw new Error(`GitHub ответил ${g.code}`);
      if (remote) { mergeInto(remote); if (remote.tz != null) TZ = +remote.tz; }
      REM = remote;
      const subs = (remote && remote.subs || []).slice();
      const mySub = LS.get('pushsub', null);
      const dead = new Set(remote && remote.subs_dead || []);
      if (mySub && !dead.has(mySub.endpoint) && !subs.some(s => s.endpoint === mySub.endpoint)) subs.push(mySub);
      const out = Object.assign({}, remote || {v: 1}, {items: D.items, purged: D.purged, subs});
      saveLocal(); render();
      if (canon(out) === canon(remote)) break;
      out.phone = nowMin();
      const p = await gh('PUT', {message: 'phone', content: b64enc(JSON.stringify(out)), ...(SHA ? {sha: SHA} : {})});
      if (p.code === 200 || p.code === 201) { SHA = p.j.content && p.j.content.sha; REM = out; saveLocal(); break; }
      if (p.code === 409 || p.code === 422) { await new Promise(r => setTimeout(r, 400 + attempt * 500)); continue; }
      if (p.code === 401 || p.code === 403) throw new Error('нет доступа (ключ отозван или истек)');
      throw new Error(`GitHub ответил ${p.code}`);
    }
    SY.state = 'ok'; SY.err = ''; SY.last = new Date().toISOString(); LS.set('last', SY.last);
  } catch (e) {
    SY.state = 'err';
    SY.err = navigator.onLine === false ? 'нет интернета' : (e && e.message === 'Failed to fetch' ? 'нет связи с GitHub' : String(e.message || e));
  } finally {
    SY.busy = false; renderSync();
    if (SY.again) { SY.again = false; queueSync(300); }
  }
}

// ---------- состояние экрана ----------
const V = {view: 'today', cal: null, sel: today(), more: null};
function setView(v, more = null) { V.view = v; V.more = more; render(true); window.scrollTo({top: 0}); }

// ---------- отрисовка ----------
function render(anim) {
  if (!CFG) return renderSetup();
  if (!$('#main')) shell();
  const t = tzNow();
  const titles = {today: 'Сегодня', upcoming: 'Предстоящее', inbox: 'Входящие', calendar: 'Календарь', more: 'Еще'};
  const mt = {deadlines: 'Сроки', done: 'Выполнено', trash: 'Корзина', settings: 'Настройки'};
  $('#ttl').innerHTML = `${esc(V.view === 'more' && V.more ? mt[V.more] : titles[V.view])}<small>${WDF[P.wday(t)]}, ${t.getUTCDate()} ${MG[t.getUTCMonth()]}</small>`;
  const m = $('#main');
  m.innerHTML = view();
  if (anim) { m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade'); }
  renderTabs(); renderSync();
}
function shell() {
  $('#app').innerHTML = `
  <header class="top">
    <div class="hrow"><h1 id="ttl"></h1><button class="syncb" id="syncb" data-act="sync"></button></div>
    <div class="qa">
      <input id="qa" type="text" placeholder="Например: встреча завтра в 15" autocomplete="off" enterkeyhint="done" autocapitalize="sentences">
      ${speech ? `<button class="ib" id="mic" data-act="mic" aria-label="Сказать голосом">${ic('mic')}</button>` : ''}
      <button class="ib primary" data-act="add" aria-label="Добавить">${ic('plus')}</button>
    </div>
    <div class="preview" id="pv"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>`;
  const q = $('#qa');
  q.addEventListener('input', preview);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); quickAdd(); } });
}
function counts() {
  const L = live(), td = today();
  const wk = P.iso(P.addDays(fromIso(td), 7));
  return {
    today: L.filter(i => !i.done && i.date === td).length,
    overdue: L.filter(isOverdue).length,
    upcoming: L.filter(i => !i.done && i.date > td && i.date <= wk).length,
    inbox: L.filter(i => !i.done && !i.date).length,
  };
}
function renderTabs() {
  const c = counts();
  const T = [['today', 'sun', 'Сегодня', c.today + c.overdue, c.overdue ? '' : 'n'], ['upcoming', 'upcoming', 'Неделя', 0], ['inbox', 'inbox', 'Входящие', c.inbox, 'n'], ['calendar', 'cal', 'Календарь', 0], ['more', 'grid', 'Еще', 0]];
  $('#tabs').innerHTML = T.map(([v, i, l, n, cls]) => `<button data-tab="${v}" class="${V.view === v ? 'on' : ''}">${ic(i)}<span>${l}</span>${n ? `<span class="badge ${cls || ''}">${n}</span>` : ''}</button>`).join('');
}
function renderSync() {
  const b = $('#syncb'); if (!b) return;

  E.tags = $('#eTags').value.split(/[\s,]+/).map(t => t.replace(/^#/, '')).filter(Boolean);
  document.querySelectorAll('[data-subt]').forEach(i => { const s = E.subtasks[+i.dataset.subt]; if (s) s.title = i.value; });
  const nw = $('#eSubNew').value.trim(); if (nw) { E.subtasks.push({title: nw, done: false}); $('#eSubNew').value = ''; }
  E.subtasks = E.subtasks.filter(s => s.title.trim());
}
function saveEditor() {
  collect();
  if (!E.title) { $('#eTitle').focus(); return; }
  const f = {title: E.title, type: E.type, date: E.date, time: E.time, remind: E.remind, repeat: E.repeat, place: E.place, notes: E.notes,
    tags: E.tags, important: E.important, urgent: E.urgent, top: E.top, subtasks: E.subtasks};
  if (E.type === 'meeting' && E.time && !E.duration) f.duration = 60;
  if (E._new) addItem(f); else updateItem(E.id, f);
  closeEditor();
  snack('Сохранено');
}

// ---------- снек ----------
let snackT = null;
function snack(text, btn, fn) {
  const s = $('#snack');
  s.querySelector('span').textContent = text;
  const b = s.querySelector('button');
  b.textContent = btn || ''; b.style.display = btn ? '' : 'none';
  b.onclick = () => { s.classList.remove('on'); fn && fn(); };
  s.classList.add('on');
  clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove('on'), btn ? 5000 : 2200);
}

// ---------- действия ----------
function toggle(id) {
  const it = find(id); if (!it) return;
  const was = it.done;
  const sp = complete(id, !was);
  if (!was) {
    if (navigator.vibrate) navigator.vibrate(12);
    snack(sp ? `Готово. Следующий раз: ${dayLabel(sp.date)}` : 'Выполнено', 'Вернуть', () => complete(id, false));
  }
}
function trash(id, isTrash) {
  if (isTrash) { purge(id); snack('Удалено навсегда'); return; }
  setDeleted(id, true);
  snack('Перемещено в корзину', 'Вернуть', () => setDeleted(id, false));
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-tab],[data-more],[data-day],[data-open],[data-etype],[data-rem],[data-flag],[data-subdel],[data-theme],[data-sub]');
  if (!t) return;
  if (t.dataset.tab) { if (t.dataset.tab === V.view && !V.more) return window.scrollTo({top: 0, behavior: 'smooth'}); return setView(t.dataset.tab); }
  if (t.dataset.more) return setView('more', t.dataset.more);
  if (t.dataset.day) { V.sel = t.dataset.day; return render(); }
  if (t.dataset.open) return openEditor(t.dataset.open);
  if (t.dataset.etype) { collect(); E.type = t.dataset.etype; return renderEditor(); }
  if (t.dataset.rem != null) { collect(); const m = +t.dataset.rem; E.remind = E.remind.includes(m) ? E.remind.filter(x => x !== m) : [...E.remind, m].sort((a, b) => b - a); return renderEditor(); }
  if (t.dataset.flag) { collect(); E[t.dataset.flag] = !E[t.dataset.flag]; return renderEditor(); }
  if (t.dataset.subdel != null) { collect(); E.subtasks.splice(+t.dataset.subdel, 1); return renderEditor(); }
  if (t.dataset.sub != null) { const s = E.subtasks[+t.dataset.sub]; if (s) s.done = t.checked; return; }
  if (t.dataset.theme) { LS.set('theme', t.dataset.theme); applyTheme(); return render(); }
  const id = t.closest('[data-id]')?.dataset.id;
  switch (t.dataset.act) {
    case 'add': return quickAdd();
    case 'mic': return mic();
    case 'sync': return queueSync(0);
    case 'toggle': { const row = t.closest('.item'); row.classList.add('pop'); setTimeout(() => toggle(id), 140); return; }
    case 'open': return openEditor(id);
    case 'close': return closeEditor();
    case 'e-save': return saveEditor();
    case 'e-del': { const iid = E.id; closeEditor(); return trash(iid); }
    case 'cal': { const d = +t.dataset.d; if (!d) { V.cal = null; V.sel = today(); } else V.cal = P.addMonths(V.cal, d); return render(); }
    case 'add-day': return openEditor(null, {date: V.sel});
    case 'over-today': { live().filter(isOverdue).forEach(i => updateItem(i.id, {date: today()})); return snack('Просроченное перенесено на сегодня'); }
    case 'empty-trash': if (confirm('Удалить все записи из корзины навсегда?')) purge(null); return;
    case 'push': return enablePush();
    case 'logout': if (confirm('Отключить телефон от Планера? Записи на компьютере останутся.')) { LS.del('cfg'); LS.del('doc'); LS.del('remote'); LS.del('sha'); LS.del('pushsub'); CFG = null; D = {items: [], purged: {}}; REM = null; SHA = null; $('#app').innerHTML = ''; render(); } return;
  }
});
$('#scrim').addEventListener('click', () => closeEditor());
window.addEventListener('popstate', () => { if (E) closeEditor(true); });

// ---------- смахивание ----------
let SWP = null;
document.addEventListener('pointerdown', e => {
  const it = e.target.closest('.item'); if (!it || e.target.closest('.check') || e.pointerType === 'mouse' && e.button) return;
  SWP = {el: it, wrap: it.parentElement, x: e.clientX, y: e.clientY, dx: 0, on: false, id: it.parentElement.dataset.id};
}, {passive: true});
document.addEventListener('pointermove', e => {
  if (!SWP) return;
  const dx = e.clientX - SWP.x, dy = e.clientY - SWP.y;
  if (!SWP.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { SWP = null; return; }
    if (Math.abs(dx) > 12) { SWP.on = true; SWP.el.style.transition = 'none'; }
    else return;
  }
  SWP.dx = dx;
  SWP.el.style.transform = `translateX(${dx}px)`;
  SWP.wrap.querySelector('.bgl').style.opacity = dx > 0 ? Math.min(1, dx / 80) : 0;
  SWP.wrap.querySelector('.bgr').style.opacity = dx < 0 ? Math.min(1, -dx / 80) : 0;
}, {passive: true});
function endSwipe() {
  if (!SWP) return;
  const s = SWP; SWP = null;
  if (!s.on) return;
  const isTrash = V.view === 'more' && V.more === 'trash';
  s.el.style.transition = 'transform .2s';
  if (s.dx > 90) {
    s.el.style.transform = 'translateX(100%)';
    setTimeout(() => isTrash ? setDeleted(s.id, false) : toggle(s.id), 180);
  } else if (s.dx < -90) {
    if (isTrash && !confirm('Удалить запись навсегда?')) { s.el.style.transform = ''; return; }
    s.el.style.transform = 'translateX(-100%)';
    setTimeout(() => trash(s.id, isTrash), 180);
  } else { s.el.style.transform = ''; }
  window._swiped = Date.now();
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', () => { if (SWP && SWP.on) { SWP.el.style.transition = 'transform .2s'; SWP.el.style.transform = ''; } SWP = null; });
document.addEventListener('click', e => { if (window._swiped && Date.now() - window._swiped < 350) { e.stopPropagation(); e.preventDefault(); } }, true);

// ---------- уведомления ----------
function urlB64(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { snack('Уведомления не разрешены'); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(REM.vapid)});
    const j = sub.toJSON();
    LS.set('pushsub', {endpoint: j.endpoint, keys: j.keys, ua: /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : 'Android', added: nowMin()});
    snack('Уведомления включены');
    queueSync(0); render();
  } catch (err) { snack('Не получилось: ' + (err.message || err)); }
}

// ---------- первый запуск ----------
function renderSetup() {
  $('#app').innerHTML = `<div class="setup"><img src="icon-192.png" alt=""><h1>Планер</h1>
  <p>Чтобы телефон видел записи с компьютера, откройте на компьютере Планер, зайдите в «Настройки - Телефон» и наведите камеру телефона на QR-код.</p>
  <p style="margin-top:22px">Или вставьте ссылку из настроек:</p>
  <input class="in" id="lnk" placeholder="https://…#k=…" autocapitalize="off" autocomplete="off">
  <button class="btn primary wide" style="margin-top:10px" data-act="link">Подключить</button></div>`;
  $('[data-act=link]').onclick = () => { if (takeLink($('#lnk').value)) { $('#app').innerHTML = ''; render(); queueSync(0); } else snack('Ссылка не подходит'); };
}
function takeLink(str) {
  const h = (str || '').split('#')[1] || '';
  const q = new URLSearchParams(h);
  const k = q.get('k'), r = q.get('r');
  if (!k || !r) return false;
  if (!CFG || CFG.token !== k || CFG.repo !== r) {
    if (CFG && CFG.repo !== r) { D = {items: [], purged: {}}; REM = null; SHA = null; }
    CFG = {token: k, repo: r}; LS.set('cfg', CFG); saveLocal();
  }
  return true;
}
function applyTheme() {
  const t = LS.get('theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
}

// ---------- запуск ----------
applyTheme();
takeLink(location.href);
// на iPhone ссылку в адресе оставляем, пока приложение не добавлено на экран «Домой»: иначе значок откроется без ключа
if (location.hash && (matchMedia('(display-mode: standalone)').matches || navigator.standalone || !/iPhone|iPad|iPod/.test(navigator.userAgent))) history.replaceState(null, '', location.pathname);
render();
if (location.search.includes('open=')) { const id = new URLSearchParams(location.search).get('open'); history.replaceState(null, '', location.pathname); setTimeout(() => find(id) && openEditor(id), 300); }
queueSync(0);
setInterval(() => { if (document.visibilityState === 'visible') queueSync(0); }, 30000);
setInterval(() => { if (document.visibilityState === 'visible' && !E && !document.activeElement?.matches('input,textarea')) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { queueSync(0); render(); } });
window.addEventListener('online', () => queueSync(0));
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.open && find(e.data.open)) openEditor(e.data.open); });
}
</script>
</body>
